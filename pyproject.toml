[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-recovery"
dynamic = ["version"]
description = "Bounded, test-gated Python code recovery and resilient patch runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Argus Contributors" }
]
keywords = [
    "ai",
    "code-repair",
    "code-recovery",
    "patch-engine",
    "developer-tools",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "keyring>=24.0.0",
    "mcp>=1.0.0,<2",
    "pyyaml>=6.0.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
# Terminal UI, including the Pillow-based logo renderers. Core recovery and the
# CLI never import these modules, so the default install stays small.
tui = [
    "textual>=8.2.0",
    "Pillow>=10.0.0",
]
# The experimental local inference gateway (`argus gateway`, alias `argus serve`). The
# desktop HTTP/SSE API (argus.api) and web app (argus/ui) also need these packages, but no
# CLI command starts them. fastapi brings in pydantic, which the gateway models use.
gateway = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
# Exact BPE token counting for budget reservation. Optional: without it (or with
# ARGUS_OFFLINE=1) a conservative byte-based estimate is used. tiktoken downloads its
# vocabulary on first use, so this is the only extra that may touch the network.
tokens = [
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "psutil>=5.9.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
# Convenience bundle for the supported CLI + TUI surfaces. The gateway/API and the
# tokenizer are intentionally excluded; request them explicitly.
all = [
    "argus-recovery[tui]",
]

[project.urls]
Homepage = "https://argus.hemangsharrma.workers.dev"
Documentation = "https://argus.hemangsharrma.workers.dev"
Repository = "https://github.com/hemang1404/Argus"
Issues = "https://github.com/hemang1404/Argus/issues"

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.dynamic]
version = { attr = "argus.__version__" }

[tool.setuptools.packages.find]
include = ["argus*"]
exclude = ["tests*", "data*", "results*", "models*", "packages*", "tools*", "argus-website*"]

[tool.setuptools.package-data]
argus = ["py.typed", "ui/*", "tui/*", "tui/*.tcss", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["data", "results", ".agents", ".gemini", "node_modules"]
markers = [
    "live_provider: marks test as requiring live external LLM provider connectivity (opt-in via ARGUS_RUN_LIVE_TESTS=1)",
    "live_antigravity: marks test as requiring live Antigravity host CLI execution",
    "real_host: marks test as requiring live Antigravity host runtime connectivity",
    "tokenizer_download: marks tests that need the real tiktoken vocabulary (network on first use; needs the 'tokens' extra)",
    "graphics: marks terminal-graphics tests requiring the 'tui' extra (Pillow)",
    "gateway: marks tests for the deferred inference-gateway milestone",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["argus-website", "node_modules", "build", "dist", "tests/fixtures"]

[tool.ruff.lint]
# pyflakes (undefined names, unused imports/variables) and pycodestyle errors. F821 caught real
# bugs in this repo (undefined names swallowed by `except Exception: pass`).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["argus"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

[tool.coverage.run]
source = ["argus"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
