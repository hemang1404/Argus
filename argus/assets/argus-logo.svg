<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230">
  <defs>
    <linearGradient id="emblem-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <style>
    .argus-letter {
      fill: none;
      stroke: #e5e7ef;
      stroke-width: 2.4;
      stroke-linecap: butt;
      stroke-linejoin: round;
    }
    .emblem-stroke {
      fill: none;
      stroke: #818cf8;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
  </style>

  <!-- Centered Diamond-Eye Emblem at X=380 -->
  <g id="argus-emblem" transform="translate(380, 52)">
    <!-- Outer diamond facets -->
    <path d="M 0 -34 L 32 0 L 0 34 L -32 0 Z" stroke="url(#emblem-glow)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <!-- Inner diamond -->
    <path d="M 0 -18 L 17 0 L 0 18 L -17 0 Z" stroke="#818cf8" stroke-width="2" fill="#0e1017" stroke-linejoin="round"/>
    <!-- Core pupil -->
    <rect x="-4.5" y="-4.5" width="9" height="9" transform="rotate(45)" fill="#c7d2fe"/>
    <!-- Left and right accent markers -->
    <path d="M -26 -14 L -38 -26 M 26 -14 L 38 -26 M -26 14 L -38 26 M 26 14 L 38 26" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Wide Architectural Wordmark (Centered at X=380, Y=132 to 196, height=64) -->
  <g id="argus-wordmark" transform="translate(98, 132)">
    <!-- A (width 70, height 64) -->
    <g transform="translate(0, 0)">
      <path d="M 0 64 V 20 Q 0 0 20 0 H 50 Q 70 0 70 20 V 64" class="argus-letter"/>
      <path d="M 0 36 H 70" class="argus-letter"/>
      <path d="M -7 64 H 7 M 63 64 H 77" class="argus-letter"/>
    </g>

    <!-- R (width 72, height 64) - Wide bowl & continuous diagonal stride -->
    <g transform="translate(125, 0)">
      <path d="M 0 64 V 0 H 50 Q 70 0 70 19 Q 70 36 50 36 L 72 64" class="argus-letter"/>
      <path d="M 0 36 H 50" class="argus-letter"/>
      <path d="M -7 64 H 7" class="argus-letter"/>
    </g>

    <!-- G (width 70, height 64) - Wide open circular geometry & balanced aperture -->
    <g transform="translate(250, 0)">
      <path d="M 64 0 H 20 Q 0 0 0 20 V 44 Q 0 64 20 64 H 50 Q 70 64 70 44 V 34 H 42" class="argus-letter"/>
    </g>

    <!-- U (width 68, height 64) - Wide square bowl matching reference 1:1 aspect ratio -->
    <g transform="translate(375, 0)">
      <path d="M 0 0 V 40 Q 0 64 24 64 H 44 Q 68 64 68 40 V 0" class="argus-letter"/>
    </g>

    <!-- S (width 70, height 64) - Extended horizontal sweeps -->
    <g transform="translate(495, 0)">
      <path d="M 70 0 H 20 Q 0 0 0 18 V 19 Q 0 33 18 33 H 52 Q 70 33 70 47 V 48 Q 70 64 50 64 H 0" class="argus-letter"/>
    </g>
  </g>
</svg>
