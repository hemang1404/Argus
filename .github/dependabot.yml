version: 2
updates:
  # Keeps the tag-pinned GitHub Actions current. Actions are pinned by tag (not commit SHA)
  # because SHAs cannot be verified offline; switch to SHA pins when reviewing a Dependabot PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The MCP server is written against the 1.x SDK; 2.x needs httpx2 and breaks the offline suite.
      # Remove this rule in a change that tests the server against 2.x.
      - dependency-name: "mcp"
        versions: [">=2"]
